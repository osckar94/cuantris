name: Compilar APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar APK (cargo quad-apk)
        run: |
          docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk bash -c \
            "cargo quad-apk build || (rustup update stable && rustup default stable && rustup target add armv7-linux-androideabi aarch64-linux-android && cargo quad-apk build)"
          sudo chown -R "$(id -u):$(id -g)" target

      - name: Preparar archivo
        run: |
          mkdir -p dist
          APK=$(find target/android-artifacts -name "*.apk" | head -n 1)
          echo "APK encontrado: $APK"
          cp "$APK" dist/cuantris.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: cuantris-apk
          path: dist/cuantris.apk

      - name: Publicar enlace de descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cuantris v1.0.${{ github.run_number }}
          body: "Descarga cuantris.apk en tu celular Android e instalalo."
          files: dist/cuantris.apk
          make_latest: true

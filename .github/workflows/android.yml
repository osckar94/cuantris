name: Compilar APK Android y version Web

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ---------- Version WEB: un enlace que abre el juego en el navegador ----------
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust para web
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Compilar version web
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Preparar pagina
        run: |
          mkdir -p web
          cp target/wasm32-unknown-unknown/release/cuantris.wasm web/
          # ?v=numero de compilacion: obliga al navegador a bajar siempre la version nueva
          sed "s/cuantris.wasm/cuantris.wasm?v=${{ github.run_number }}/; s/mq_js_bundle.js/mq_js_bundle.js?v=${{ github.run_number }}/" web_index.html > web/index.html
          BUNDLE=$(find ~/.cargo/registry/src -path "*macroquad-0.4*/js/mq_js_bundle.js" | head -n 1)
          if [ -n "$BUNDLE" ]; then cp "$BUNDLE" web/; else curl -fL -o web/mq_js_bundle.js https://raw.githubusercontent.com/not-fl3/macroquad/master/js/mq_js_bundle.js; fi
          ls -la web

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4

  # ---------- Version APK para instalar en Android ----------
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar APK (cargo quad-apk)
        run: |
          docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk bash -c \
            "cargo quad-apk build || (rustup update stable && rustup default stable && rustup target add armv7-linux-androideabi aarch64-linux-android && cargo quad-apk build)"
          sudo chown -R "$(id -u):$(id -g)" target

      - name: Preparar archivo
        run: |
          mkdir -p dist
          APK=$(find target/android-artifacts -name "*.apk" | head -n 1)
          echo "APK encontrado: $APK"
          cp "$APK" dist/cuantris.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: cuantris-apk
          path: dist/cuantris.apk

      - name: Publicar enlace de descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cuantris v1.0.${{ github.run_number }}
          body: "Descarga cuantris.apk en tu celular Android e instalalo."
          files: dist/cuantris.apk
          make_latest: true
